app_id: ai.nimi.harness
display_name: Nimi Harness
version: 0.2.0
profile: standalone
manifest_role: submitted-input
app_access:
  - runtime.consume
  - app.activity
  - integration.provide
  - integration.consume
capability_contract_refs:
  - text.generate
  - audio.transcribe
required_standardized_feature_refs: []
storage_policy:
  kind: app-owned-os-storage
  os_storage_disclosure:
    - path_pattern: <user-home>/.nimi-harness/**
      purpose: Account-partitioned session transcripts and working files.
      expected_size_band: Depends on the size and number of tasks.
metadata:
  summary: A desktop assistant for working with files and Nimi models.
  icon: assets/app-icon.png
  release_notes: RELEASE_NOTES.md
local_development:
  mobile:
    command: pnpm run dev:android
  electron:
    renderer_origin: http://127.0.0.1:1509
  web:
    command: pnpm run dev:web-renderer
    origin: ""
    redirect_uri: ""
    client_id: ""
    local:
      origin: https://127.0.0.1:4509
      redirect_uri: https://127.0.0.1:4509/
      client_id: ai.nimi.harness.web.dev
      realm_environment_id: dev
      realm_url: http://127.0.0.1:3002
      official_web_url: http://localhost:3000
